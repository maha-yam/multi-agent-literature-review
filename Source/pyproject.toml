[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revue-litterature-sma"
version = "1.0.0"
description = "SMA Agentic AI – Assistant Revue de Littérature et Détection de Research Gaps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # LLM – Google Gemini (gratuit) via adaptateur llm_adapter.py
    "google-genai>=2.0.0",
    # Agent Orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    # Vector Database
    "chromadb>=0.5.0",
    # Embeddings (local, no API cost)
    "sentence-transformers>=3.0.0",
    # PDF Processing
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    # Text Splitting
    "langchain-text-splitters>=0.3.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "rich>=13.0.0",
    # Jupyter
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
